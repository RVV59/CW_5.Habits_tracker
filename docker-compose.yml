services:
  db:
    image: postgres:17-alpine
    container_name: habits_db
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    image: redis:7-alpine
    container_name: habits_redis
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: habits-tracker-app:latest
    container_name: habits_app
    restart: always
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: >
      sh -c "
        echo 'Waiting for database...'
        while ! nc -z db 5432; do sleep 0.1; done;
        echo 'Database available!';
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "

  celery:
    image: habits-tracker-app:latest
    container_name: habits_celery
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: >
      sh -c "
        echo 'Celery Worker: Waiting for database...'
        while ! nc -z db 5432; do sleep 0.1; done;
        echo 'Celery Worker: Database available!';
        celery -A config worker -l INFO
      "

  celery-beat:
    image: habits-tracker-app:latest
    container_name: habits_celery_beat
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: >
      sh -c "
        echo 'Celery Beat: Waiting for database...'
        while ! nc -z db 5432; do sleep 0.1; done;
        echo 'Celery Beat: Database available!';
        celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
      "

  nginx:
    image: nginx:latest
    container_name: habits_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - app

volumes:
  pg_data:
  static_volume:
  media_volume: