services:
  db:
    image: postgres:17-alpine
    container_name: habits_db
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}


  redis:
    image: redis:7-alpine
    container_name: habits_redis
    restart: always

  app:
    build: .
    container_name: habits_app
    restart: always
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis

    command: >
      sh -c "
        echo 'Waiting for database...'
        while ! nc -z db 5432; do
          sleep 0.1
        done;
        echo 'Database available!';

        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
  celery:
    build: .
    container_name: habits_celery
    restart: always
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
#      - app
      - db # Sunday, September 7, 2025 10:33:37 PM
      - redis
#    command: sh -c "celery -A config worker -l INFO"
    command: >
      sh -c "
        echo 'Celery Worker: Waiting for database...'
        while ! nc -z db 5432; do
          sleep 0.1
        done;
        echo 'Celery Worker: Database available!';
        celery -A config worker -l INFO
      "

  celery-beat:
    build: . # Используем тот же образ, что и для app
    container_name: habits_celery_beat
    restart: always
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
#      - app
      - db # Sunday, September 7, 2025 10:33:37 PM
      - redis
#    command: sh -c "celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    command: >
      sh -c "
        echo 'Celery Beat: Waiting for database...'
        while ! nc -z db 5432; do
          sleep 0.1
        done;
        echo 'Celery Beat: Database available!';
        celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
      "
  nginx:
    image: nginx:latest
    container_name: habits_nginx
    restart: always
    ports:
      - "80:80" # Пробрасываем порт 80 контейнера на порт 80 нашего компьютера
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf # Конфигурационный файл Nginx
      - static_volume:/app/static # Делаем доступной папку со статикой
      - media_volume:/app/media   # Делаем доступной папку с медиа
    depends_on:
      - app

volumes:
  pg_data:
  static_volume:
  media_volume: