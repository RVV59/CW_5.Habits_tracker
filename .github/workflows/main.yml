name: Django CI/CD

on:
  push:
    branches: [ "develop" ]

jobs:
  # --- Этап 1: Проверка качества кода (Линтинг) ---
  lint:
    runs-on: ubuntu-latest
    steps:
      # Шаг 1.1: Получаем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v3

      # Шаг 1.2: Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Шаг 1.3: Устанавливаем зависимости для линтера
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Шаг 1.4: Запускаем линтер
      - name: Run linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # --- Этап 2: Запуск тестов ---
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test

  # --- Этап 3: Проверка сборки Docker-образа ---
  build:
    # Эта задача будет запущена только после успешного завершения 'lint' и 'tests'
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Шаг 3.1: Пытаемся собрать образы, чтобы убедиться, что Dockerfile и docker-compose.yml корректны
      - name: Build Docker images
        run: docker-compose build

  # --- Этап 4: Развертывание на сервере ---
  deploy:
    # Эта задача будет запущена только после успешной сборки образов
    needs: build
    runs-on: ubuntu-latest
    # Дополнительное условие: запускать только при пуше в main, чтобы избежать случайных деплоев
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Шаг 4.1: Подключение к серверу и обновление кода
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Переходим в папку проекта и обновляем код
            cd CW_5.Habits_tracker
            git pull

      # Шаг 4.2: Создание файла .env на сервере
      - name: Create .env file
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd CW_5.Habits_tracker
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
            echo "DEBUG=False" >> .env
            echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "DB_HOST=db" >> .env
            echo "DB_PORT=5432" >> .env
            echo "REDIS_HOST=redis" >> .env
            echo "REDIS_PORT=6379" >> .env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env

      # Шаг 4.3: Запуск docker-compose на сервере
      - name: Run docker-compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd CW_5.Habits_tracker
            # Пересобираем и перезапускаем контейнеры
            docker-compose up --build -d
