name: Django CI/CD

on: [push, pull_request]

jobs:
  # --- Этап 1: Проверка качества кода (Линтинг) ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # --- КЛЮЧЕВОЕ ИЗМЕНЕНИЕ ---
      - name: Install dependencies with Poetry
        run: |
          pip install poetry
          poetry install

      # --- КЛЮЧЕВОЕ ИЗМЕНЕНИЕ ---
      - name: Run linter with Poetry
        run: poetry run flake8 .

  # --- Этап 2: Запуск тестов ---
  tests:
    runs-on: ubuntu-latest
    # 1. Запускаем сервис с PostgreSQL специально для этого шага
    services:
      postgres:
        image: postgres:17  # Используем образ PostgreSQL
        env:
          # Задаем переменные для создания тестовой БД
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432 # Пробрасываем порт, чтобы Django мог подключиться
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # --- КЛЮЧЕВОЕ ИЗМЕНЕНИЕ ---
      - name: Install dependencies with Poetry
        run: |
          pip install poetry
          poetry install

      # --- КЛЮЧЕВОЕ ИЗМЕНЕНИЕ ---
      - name: Run tests with Poetry
        run: poetry run python manage.py test

  # --- Этап 3: Проверка сборки Docker-образа (остается без изменений) ---
  # Dockerfile сам должен уметь работать с Poetry, этот шаг просто проверяет его
  build:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build Docker images
        run: docker-compose build

  # --- Этап 4: Развертывание на сервере (остается без изменений) ---
  # --- Этап 4: Развертывание на сервере ---
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Deploy to server and run application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Переходим в директорию проекта
            cd CW_5.Habits_tracker

            # 1. Обновляем код из репозитория
            git pull

            # 2. Динамически создаем .env файл
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
            echo "DEBUG=False" >> .env
            echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "DB_HOST=db" >> .env
            echo "DB_PORT=5432" >> .env
            echo "REDIS_HOST=redis" >> .env
            echo "REDIS_PORT=6379" >> .env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env

            # 3. Пересобираем и перезапускаем контейнеры
            docker-compose up --build -d
