name: Django CI/CD

on: [push, pull_request]

jobs:
  # --- Этап 1: Проверка качества кода (Линтинг) ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # --- КЛЮЧЕВОЕ ИЗМЕНЕНИЕ ---
      - name: Install dependencies with Poetry
        run: |
          pip install poetry
          poetry install

      # --- КЛЮЧЕВОЕ ИЗМЕНЕНИЕ ---
      - name: Run linter with Poetry
        run: poetry run flake8 .

  # --- Этап 2: Запуск тестов ---
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # --- КЛЮЧЕВОЕ ИЗМЕНЕНИЕ ---
      - name: Install dependencies with Poetry
        run: |
          pip install poetry
          poetry install

      # --- КЛЮЧЕВОЕ ИЗМЕНЕНИЕ ---
      - name: Run tests with Poetry
        run: poetry run python manage.py test

  # --- Этап 3: Проверка сборки Docker-образа (остается без изменений) ---
  # Dockerfile сам должен уметь работать с Poetry, этот шаг просто проверяет его
  build:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build Docker images
        run: docker-compose build

  # --- Этап 4: Развертывание на сервере (остается без изменений) ---
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # ... шаги деплоя остаются прежними
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd CW_5.Habits_tracker
            git pull

      - name: Create .env file
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd CW_5.Habits_tracker
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
            # ... остальные переменные
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env

      - name: Run docker-compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd CW_5.Habits_tracker
            docker-compose up --build -d